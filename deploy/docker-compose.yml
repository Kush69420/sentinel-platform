# SENTINEL Platform — Docker Compose stack for the OMV homelab (staging).
#
# Replaces deploy/sentinel.service + deploy/nginx.conf (the native-install reference,
# kept for the eventual move to paid compute). Bring up with:
#   cd deploy && ./prepare-host.sh && docker compose up -d
#
# Topology — nothing is published to the LAN; the only inbound path is the tunnel:
#   Cloudflare edge (TLS) --outbound tunnel--> cloudflared -> nginx -> app -> mysql
#
# Two facts about the host drive most of the choices below (see DOCKER_DEPLOY.md):
#   1. /var/lib/docker is on the 28 GiB OS disk. All state is bind-mounted onto the
#      big pools and every service caps its log size, or the root fs fills and takes
#      OMV down with it.
#   2. 7.7 GiB RAM total, shared with the existing jellyfin/navidrome containers, so
#      every service has an explicit mem_limit and cannot starve them.

name: sentinel

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.4
    container_name: sentinel-mysql
    restart: unless-stopped
    logging: *logging
    mem_limit: 3g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      # Must stay sentinel_db — db_setup.sql hardcodes `USE sentinel_db`.
      MYSQL_DATABASE: sentinel_db
      MYSQL_USER: ${SENTINEL_DB_USER:-sentinel_user1}
      MYSQL_PASSWORD: ${SENTINEL_DB_PASSWORD:?set SENTINEL_DB_PASSWORD in deploy/.env}
    volumes:
      # Datadir on `blue` (ext4). Deliberately NOT on the btrfs pool: copy-on-write
      # fragments InnoDB and RAID1 doubles every write, worst during the bulk import.
      # Redundancy is bought back by backup.sh dumping to the RAID1 pool instead.
      - ${SENTINEL_MYSQL_DIR:?set SENTINEL_MYSQL_DIR in deploy/.env}:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/sentinel.cnf:ro
      # Schema sources, read-only, applied once by the init script on an empty datadir.
      - ../db_setup.sql:/sentinel-sql/db_setup.sql:ro
      - ../migration_admin_customization.sql:/sentinel-sql/migration_admin_customization.sql:ro
      - ../migration_fix_import_errors.sql:/sentinel-sql/migration_fix_import_errors.sql:ro
      - ../migration_selfserve_auth.sql:/sentinel-sql/migration_selfserve_auth.sql:ro
      - ../migration_coming_soon.sql:/sentinel-sql/migration_coming_soon.sql:ro
      - ./db-init/00-apply-schema.sh:/docker-entrypoint-initdb.d/00-apply-schema.sh:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Generous: first boot applies four schema files before MySQL accepts traffic,
      # and this is a spinning disk.
      start_period: 180s
    networks: [sentinel]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: sentinel-app:local
    container_name: sentinel-app
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    # app.env holds the application's own secrets (SECRET_KEY, ENCRYPTION_KEY, ...).
    # It is a separate file from .env so that MYSQL_ROOT_PASSWORD, which .env needs for
    # compose interpolation, is never injected into the app container.
    env_file: [app.env]
    environment:
      # Authoritative overrides — these must match the topology, not whatever app.env
      # happens to say.
      DB_HOST: mysql
      DB_NAME: sentinel_db
      FLASK_ENV: production
      # Exactly one trusted hop: nginx emits a single X-Forwarded-For value after the
      # realip module has recovered the true client. See nginx.docker.conf.
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      # Encrypted gov-ID uploads live on the btrfs RAID1 pool — they are irreplaceable
      # and small, so mirroring costs nothing meaningful here.
      - ${SENTINEL_UPLOADS_DIR:?set SENTINEL_UPLOADS_DIR in deploy/.env}:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      # `/` is enough to prove the WSGI app is serving; it does not touch the DB, so a
      # DB outage shows up as /api/admin/health going red rather than as a restart loop.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [sentinel]

  nginx:
    image: nginx:1.27-alpine
    container_name: sentinel-nginx
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    ports:
      # Loopback ONLY, and only for debugging from a shell on the NAS — cloudflared
      # reaches nginx over the compose network, not through this. Never bind 0.0.0.0:
      # host :80 is OMV's own web UI, and exposing nginx to the LAN would let any LAN
      # client forge CF-Connecting-IP and defeat the login rate limit (see
      # realip.cloudflare.conf).
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
      # Cloudflare variant: reads CF-Connecting-IP. Swap to realip.tailscale.conf if
      # the access layer ever changes; see those files for why they are not one file.
      - ./realip.cloudflare.conf:/etc/nginx/conf.d/realip.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [sentinel]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: sentinel-cloudflared
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    # NAMED TUNNEL, token-run. Serves sentinel.needlegal.in at a stable hostname; the
    # quick tunnel it replaces re-randomised its URL on every restart of this container.
    #
    # This is SENTINEL's OWN tunnel and must stay that way. The NAS also runs a separate
    # host-level cloudflared (systemd `cloudflared.service`, /etc/cloudflared/config.yml)
    # for the probablysecure.tech zone. Do not route sentinel through that one and do not
    # edit its config — the two zones are kept deliberately independent.
    #
    # Ingress lives in ./cloudflared.sentinel.yml, in this repo — see that file. The
    # tunnel runs locally-managed (config + credentials file) rather than with --token,
    # so the route is reviewable in git instead of sitting behind a Zero Trust dashboard
    # tab. Consequence: Cloudflare does NOT create the DNS record for us in this mode.
    # The zone needs a proxied CNAME `sentinel` -> <tunnel-id>.cfargotunnel.com.
    #
    # The credentials file is derived from CLOUDFLARE_TUNNEL_TOKEN (the token is base64
    # JSON carrying exactly the AccountTag/TunnelID/TunnelSecret a credentials file
    # holds). It is not in git; it lives at SENTINEL_CLOUDFLARED_DIR on the host and must
    # be owned by uid 65532, this image's nonroot user, or the tunnel cannot read it.
    #
    # Cloudflare Access can be applied to a named tunnel (it cannot to a quick one). It is
    # not enabled yet, so the app is still internet-reachable with the admin/admin123 seed
    # from db_setup.sql — set a strong password on that account (see DOCKER_DEPLOY.md).
    #
    # --protocol http2 is REQUIRED on this network, not a preference: the campus
    # gateway silently drops outbound TCP 7844, which is what cloudflared's default
    # QUIC/h2mux edge transport uses. http2 forces the edge connection over TCP 443,
    # which is open. Symptom if this is removed: registration times out with
    # "context deadline exceeded".
    #
    # --metrics is pinned to 127.0.0.1:20241 (loopback inside the container only, never
    # published) so the healthcheck below has a fixed address to probe. Left unset, the
    # flag defaults to "0.0.0.0:0" and cloudflared picks whatever's free in
    # [20241..20245] or, if all of those are taken, a random port — `cloudflared tunnel
    # ready` then has nothing reliable to hit. Confirmed live in the running container
    # (2026-08-24): with no flag it happened to land on 20241, but that's not a
    # guarantee, hence pinning it explicitly.
    command: tunnel --no-autoupdate --protocol http2 --metrics 127.0.0.1:20241 --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared.sentinel.yml:/etc/cloudflared/config.yml:ro
      - ${SENTINEL_CLOUDFLARED_DIR:?set SENTINEL_CLOUDFLARED_DIR in deploy/.env}:/creds:ro
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      # cloudflared NEVER exits on its own, even with every edge connection down — it
      # retries internally forever (confirmed in the 2026-08-23/24 incident: 4
      # connections dropped, container stayed "Up", exit code never fired). That means
      # `restart: unless-stopped` above has nothing to trigger on — there is no exit for
      # Docker to react to. This healthcheck exists for OBSERVABILITY (`docker ps` /
      # `docker compose ps`, and the health gate in sentinel-deploy.sh), NOT for restart:
      # Docker does not restart a container just because its healthcheck goes unhealthy.
      # The actual restart-after-sustained-failure logic lives in the host-level
      # sentinel-cloudflared-watchdog systemd timer (deploy/systemd/), which probes
      # independently via `docker exec ... cloudflared tunnel ready` rather than
      # trusting this field — so it keeps working even if this healthcheck subsystem
      # itself misbehaves. See that timer/service for the restart logic and thresholds.
      #
      # `tunnel ready` calls cloudflared's own /ready endpoint and maps the result to an
      # exit code — it IS the cloudflared binary, so it runs in this distroless image
      # where there is no shell/curl/wget. Must stay CMD (exec) form, never CMD-SHELL.
      #
      # interval/retries/start_period are deliberately NOT aggressive: the tunnel was
      # observed self-healing in ~20s during the 2026-08-23 incident (all 4 edge
      # connections dropped when caa.service's 2-hourly captive-portal renewal bounced
      # the NAT'd container network; they re-registered ~20s later with no restart at
      # all). Flipping to "unhealthy" on the first missed probe would make `docker ps`
      # and the deploy health gate flap on something that was already resolving itself.
      # 45s interval x 3 retries = ~90s of sustained failure before this reports
      # unhealthy — comfortably past the ~20s self-heal window. DO NOT shorten this "to
      # be more responsive" without re-reading this comment and the watchdog's.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 45s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [sentinel]

networks:
  sentinel:
    driver: bridge
    ipam:
      config:
        # Pinned because realip.*.conf hardcodes this CIDR as the trusted peer range.
        # If you change it, change those files too.
        - subnet: 172.28.0.0/16
