# Client-IP recovery when `tailscale serve` on the NAS host fronts the stack.
#
# tailscale serve terminates TLS on the tailnet hostname and proxies to nginx's
# published 127.0.0.1 port, setting X-Forwarded-For to the single tailnet IP of the
# calling device. Because the connection arrives through Docker's published-port NAT,
# nginx sees the compose network's gateway as the peer, not 127.0.0.1 — hence the
# CIDR below, which must match the pinned `sentinel` network subnet in
# docker-compose.yml.
set_real_ip_from 172.28.0.0/16;
real_ip_header   X-Forwarded-For;
real_ip_recursive on;

# tailscale serve sets X-Forwarded-Proto: https. Fall back to the real scheme so a
# direct container-to-container request still reports something truthful.
map $http_x_forwarded_proto $sentinel_scheme {
    ""      $scheme;
    default $http_x_forwarded_proto;
}
