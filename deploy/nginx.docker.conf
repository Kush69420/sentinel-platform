# SENTINEL Platform — nginx config for the Docker Compose deploy.
#
# Container-network variant of deploy/nginx.conf (which stays as the reference for a
# native install). Differences, and why:
#   * No TLS here. Whatever fronts the stack (Tailscale on the host today, Cloudflare
#     Tunnel later) terminates TLS, so there is no cert to serve.
#   * Upstream is the `app` compose service by name, not 127.0.0.1.
#   * The client IP is recovered with the realip module — see realip.conf.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf, i.e. inside the http block.

# Front-end-specific client-IP recovery. docker-compose.yml symlinks/binds one of
# realip.tailscale.conf or realip.cloudflare.conf here. Getting this wrong means the
# login rate limit and lockout counter key off the wrong address, so it is a separate,
# explicit file rather than a commented-out block someone can half-swap.
include /etc/nginx/conf.d/realip.conf;

# Re-resolve the `app` service through Docker's embedded DNS instead of caching the IP
# from nginx startup — otherwise `docker compose up -d app` on its own leaves nginx
# proxying to a dead container IP until nginx is also restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;  # two uploads up to 5MB each + form/multipart overhead

    # realip.conf has already rewritten $remote_addr to the true client, so we emit
    # exactly ONE X-Forwarded-For value. That is why TRUSTED_PROXY_COUNT must be 1 —
    # the app sees precisely one trusted hop. Do not raise it, and do not switch this
    # to $proxy_add_x_forwarded_for (which appends and would make the count wrong).
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $sentinel_scheme;

    location /api/events {
        set $sentinel_upstream http://app:8000;
        proxy_pass $sentinel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;              # required — otherwise nginx buffers the
                                          # SSE stream and the client sees nothing
                                          # until EVENT_STREAM_MAX_SECONDS elapses
        proxy_read_timeout 640s;          # > gunicorn --timeout (630s) and
                                          # > EVENT_STREAM_MAX_SECONDS (600s)
        add_header X-Accel-Buffering no;  # explicit belt-and-suspenders
    }

    location / {
        set $sentinel_upstream http://app:8000;
        proxy_pass $sentinel_upstream;
    }

    # Do NOT add a `location /uploads/ { alias ...; }` block. /uploads/<filename> is
    # @admin_required and decrypts ciphertext in Flask (app.py:1605-1624) — serving it
    # as a static alias would bypass both auth and decryption.
}
