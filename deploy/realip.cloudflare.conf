# Client-IP recovery when a `cloudflared` container fronts the stack.
#
# Use CF-Connecting-IP, NOT X-Forwarded-For: the Cloudflare edge *appends* the real
# client IP to any XFF the client supplied, so the leftmost XFF value is attacker-
# controlled. CF-Connecting-IP is always set by the edge to the true client address
# and cannot be spoofed through the tunnel.
#
# The CIDR must match the pinned `sentinel` network subnet in docker-compose.yml —
# cloudflared runs as a service on that network. This is only safe while nginx
# publishes no port reachable from the LAN; if you expose one, a LAN client could set
# CF-Connecting-IP itself.
set_real_ip_from 172.28.0.0/16;
real_ip_header   CF-Connecting-IP;

map $http_x_forwarded_proto $sentinel_scheme {
    ""      $scheme;
    default $http_x_forwarded_proto;
}
