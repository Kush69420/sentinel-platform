<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SENTINEL — Analysis Workspace</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--surface:#0d0d0d;--panel:#1A1A1A;--border:#2b2b2b;--cyan:#00d2ff;--green:#37ff97;--red:#ff4f73;--amber:#ffbf38;--text:#e5f4ff;--muted:#7696b6;--mono:'JetBrains Mono',Consolas,monospace;--sans:'Inter',system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);height:100vh;display:flex;flex-direction:column}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,210,255,.012) 3px,rgba(0,210,255,.012) 4px)}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg)}.term-chrome{display:flex;gap:6px;margin-bottom:6px}.term-dot{width:9px;height:9px;border-radius:50%;display:inline-block}.term-dot.r{background:var(--red)}.term-dot.y{background:var(--amber)}.term-dot.g{background:var(--green)}.brand{font-family:var(--mono);letter-spacing:4px;color:var(--cyan)}.btn{border:1px solid var(--cyan);background:rgba(0,210,255,.1);color:var(--cyan);border-radius:8px;padding:8px 12px;cursor:pointer;font-family:var(--mono);font-size:12px}.tabs{display:flex;gap:4px;overflow:auto;border-bottom:1px solid var(--border);background:var(--bg);padding:8px}.tab{padding:9px 12px;border:1px solid var(--border);border-radius:8px;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:12px}.tab.active{color:var(--cyan);background:rgba(0,210,255,.1)}.sheet{flex:1;overflow:auto}.grid{border-collapse:collapse;width:100%;min-width:900px}th,td{border:1px solid rgba(43,43,43,.8);padding:7px 9px;font-size:12px;vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{position:sticky;top:0;background:var(--panel);color:var(--cyan);font-family:var(--mono);z-index:2}tr:nth-child(even) td{background:rgba(26,26,26,.45)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px}.card{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:14px}.label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:1px}.value{font-family:var(--mono);font-size:28px;color:var(--cyan)}.muted{color:var(--muted)}pre{white-space:pre-wrap}@media(max-width:700px){.summary{grid-template-columns:1fr}.top{align-items:flex-start;height:auto;gap:8px;flex-direction:column;padding:10px}}
</style></head><body><div class="top"><div><div class="term-chrome" aria-hidden="true"><span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span></div><div class="brand">SENTINEL WORKSPACE</div><div class="muted" id="meta">Batch {{ batch_id }}</div></div><div><button class="btn" onclick="location.href='/admin'">Admin</button> <button class="btn" onclick="downloadJSON()">Export JSON</button> <button class="btn" onclick="window.open('/api/admin/import/report/{{ batch_id }}/pdf','_blank')">PDF Report</button></div></div><div class="tabs" id="tabs"></div><div class="sheet" id="sheet"><div class="muted" style="padding:20px">Loading workspace...</div></div><script>
const batchId={{ batch_id }};let workspace=null,currentTab='';
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function load(){const r=await fetch('/api/analysis/workspace/'+batchId);workspace=await r.json();if(!r.ok){sheet.innerHTML='<div style="color:var(--red);padding:20px">'+esc(workspace.error||'Failed')+'</div>';return}meta.textContent=`Batch ${esc(batchId)} · ${esc(workspace.type.toUpperCase())} · ${esc(workspace.batch.original_filename||'')}`;const names=Object.keys(workspace.tabs||{});tabs.innerHTML=names.map((n,i)=>`<div class="tab ${i===0?'active':''}" onclick="showTab('${esc(n)}',this)">${esc(n.replaceAll('_',' ').toUpperCase())}</div>`).join('');showTab(names[0],tabs.firstElementChild)}
function showTab(name,el){currentTab=name;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');render(workspace.tabs[name])}
function render(data){if(data==null){sheet.innerHTML='<div class="muted" style="padding:20px">No data</div>';return}if(!Array.isArray(data)){if(data.edges) return renderGraph(data); if(typeof data==='object') return renderSummary(data); sheet.innerHTML='<pre>'+esc(JSON.stringify(data,null,2))+'</pre>';return}if(data.length===0){sheet.innerHTML='<div class="muted" style="padding:20px">No rows</div>';return}if(Array.isArray(data[0])) data=data.map(x=>({value:x[0],count:x[1]}));const cols=[...new Set(data.flatMap(r=>Object.keys(r||{})))];sheet.innerHTML='<table class="grid"><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>'<tr>'+cols.map(c=>'<td title="'+esc(r[c])+'">'+esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}
function renderSummary(obj){sheet.innerHTML='<div class="summary">'+Object.entries(obj).map(([k,v])=>`<div class="card"><div class="label">${esc(k)}</div><div class="value">${esc(typeof v==='object'?JSON.stringify(v):v)}</div></div>`).join('')+'</div>'}
function renderGraph(g){const edges=g.edges||[];sheet.innerHTML='<div class="summary"><div class="card"><div class="label">EDGES</div><div class="value">'+edges.length+'</div></div></div><table class="grid"><thead><tr><th>From</th><th>To</th><th>Duration/Frequency</th></tr></thead><tbody>'+edges.map(e=>`<tr><td>${esc(e.from)}</td><td>${esc(e.to)}</td><td>${esc(e.duration||e.frequency||'')}</td></tr>`).join('')+'</tbody></table>'}
function downloadJSON(){const blob=new Blob([JSON.stringify(workspace,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sentinel_workspace_'+batchId+'.json';a.click()}
load();
</script></body></html>
