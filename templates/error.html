<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>{{ code }} — SENTINEL</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="stylesheet" href="/static/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--surface:#0d0d0d;--panel:#1A1A1A;--border:#2b2b2b;--border2:#00b8cc;--cyan:#00d2ff;--green:#37ff97;--red:#ff4f73;--amber:#ffbf38;--purple:#a46bff;--text:#e5f4ff;--muted:#7696b6;--mono:'JetBrains Mono',Consolas,monospace;--sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;--brand:#00E5FF;--brand-2:#00b8cc;--glow:#39FF14}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% -15%,rgba(0,229,255,.2),transparent 35%),var(--bg);color:var(--text);font-family:var(--sans);text-align:center;padding:24px}
.brand{font-family:var(--mono);letter-spacing:6px;color:var(--cyan);font-size:19px;text-shadow:0 0 24px rgba(0,210,255,.5);margin-bottom:32px}
.brand span{color:var(--red)}
.card{border:1px solid var(--border);background:rgba(26,26,26,.88);border-radius:18px;padding:40px 36px;max-width:420px;box-shadow:0 18px 70px rgba(0,0,0,.28)}
.code{font-family:var(--mono);font-size:56px;color:var(--red);text-shadow:0 0 24px rgba(255,79,115,.35)}
.message{color:#9bb5ce;font-size:16px;margin:14px 0 26px}
.btn{display:inline-block;border:1px solid var(--brand);background:rgba(0,229,255,.12);color:var(--cyan);border-radius:10px;padding:10px 20px;font-family:var(--mono);font-size:12px;letter-spacing:1px;text-decoration:none;transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--glow);box-shadow:0 0 18px rgba(57,255,20,.25)}
</style>
</head>
<body>
<div>
<div class="brand">SEN<span>TI</span>NEL</div>
<div class="card">
<div class="code">{{ code }}</div>
<p class="message">{{ message }}</p>
<a class="btn" href="/">▶ Back to home</a>
</div>
</div>
</body>
</html>
