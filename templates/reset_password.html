<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SENTINEL — Set New Password</title>
<link rel="icon" href="/static/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
:root{
  --bg:#050505;--surface:#0d0d0d;--panel:#1A1A1A;--border:#1A1A1A80;--border2:#2b2b2b;
  --cyan:#00d2ff;--green:#37ff97;--red:#ff4f73;--amber:#ffbf38;
  --text:#e5f4ff;--muted:#7696b6;--mono:'JetBrains Mono',Consolas,monospace;--sans:'Inter',system-ui,sans-serif;
  --brand:#00E5FF;--brand-2:#00b8cc;--glow:#39FF14;
}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 50% -20%,rgba(0,229,255,.20),transparent 34%),var(--bg);color:var(--text);font-family:var(--sans)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,229,255,.015) 3px,rgba(0,229,255,.015) 4px)}
.wrap{width:min(440px,100%);position:relative;z-index:1}
.brand{text-align:center;font-family:var(--mono);letter-spacing:7px;color:var(--cyan);font-size:25px;text-shadow:0 0 24px rgba(0,210,255,.5);position:relative;display:block}
.glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;opacity:0;pointer-events:none;letter-spacing:inherit}
.glitch:hover::before{opacity:.7;color:var(--brand);transform:translate(-2px,-1px);mix-blend-mode:screen;clip-path:inset(0 0 55% 0)}
.glitch:hover::after{opacity:.7;color:var(--glow);transform:translate(2px,1px);mix-blend-mode:screen;clip-path:inset(45% 0 0 0)}
.sub{text-align:center;font-family:var(--mono);letter-spacing:2px;color:var(--muted);font-size:11px;margin:8px 0 22px}
.card{border:1px solid var(--border2);background:rgba(26,26,26,.92);border-radius:18px;box-shadow:0 20px 80px rgba(0,0,0,.45),0 0 50px rgba(0,229,255,.06)}
.card.term-window{padding:0;overflow:hidden}
.term-window .term-bar{display:flex;align-items:center;gap:6px;padding:11px 16px;background:linear-gradient(180deg,rgba(26,26,26,.95),rgba(43,43,43,.6));border-bottom:1px solid var(--border2)}
.term-window .term-dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-window .term-dot.r{background:#ff5f57}
.term-window .term-dot.y{background:#febc2e}
.term-window .term-dot.g{background:#28c840}
.term-window .term-label{margin-left:8px;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.5px}
.term-window .term-body{padding:24px;font-family:var(--sans)}
.field{margin-bottom:13px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,229,255,.18)}
.hint{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.btn{width:100%;margin-top:8px;border:1px solid var(--brand);background:linear-gradient(135deg,var(--brand),var(--brand-2));color:white;border-radius:12px;padding:13px;font-family:var(--mono);letter-spacing:2px;cursor:pointer}
.btn:hover{box-shadow:0 0 26px rgba(0,229,255,.3)}
.btn[disabled]{opacity:.55;cursor:default}
.msg{display:none;border-radius:10px;padding:11px;font-size:13px;line-height:1.6;margin-bottom:14px}
.msg.show{display:block}
.msg.ok{border:1px solid rgba(55,255,151,.35);background:rgba(55,255,151,.08);color:var(--green)}
.msg.bad{border:1px solid rgba(255,79,115,.35);background:rgba(255,79,115,.08);color:var(--red)}
.alt{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
.alt a{color:var(--cyan);text-decoration:none}
@media(max-width:480px){.term-window .term-body{padding:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand glitch" data-text="SENTINEL">SENTINEL</div>
  <div class="sub">SET A NEW PASSWORD</div>
  <div class="card term-window">
    <div class="term-bar" aria-hidden="true">
      <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
      <span class="term-label">officer@sentinel:~/reset</span>
    </div>
    <div class="term-body">
    <div class="msg" id="msg"></div>
    <form id="resetForm">
      <div class="field"><label>RESET CODE</label><input name="token" id="token" required placeholder="Provided by your administrator"></div>
      <div class="field"><label>NEW PASSWORD</label><input type="password" name="password" required autocomplete="new-password"></div>
      <div class="field"><label>CONFIRM NEW PASSWORD</label><input type="password" name="confirm" required autocomplete="new-password"></div>
      <div class="hint">Minimum 10 characters, including at least one letter and one number.</div>
      <button class="btn" id="btn">▶ SET PASSWORD</button>
    </form>
    <div class="alt"><a href="/login">Back to sign in</a></div>
    </div>
  </div>
</div>
<script>
const form=document.getElementById('resetForm'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
// The code arrives as a link from the admin; prefill it so it is not retyped.
const fromUrl=new URLSearchParams(location.search).get('token');
if(fromUrl){document.getElementById('token').value=fromUrl}
function say(text,ok){msg.textContent=text;msg.className='msg show '+(ok?'ok':'bad')}
form.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=new FormData(form);
  if(f.get('password')!==f.get('confirm')){return say('Passwords do not match.',false)}
  btn.disabled=true;btn.textContent='SETTING…';
  try{
    const r=await fetch('/api/user/password-reset/confirm',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:f.get('token'),password:f.get('password')})});
    const d=await r.json();
    if(r.ok){say(d.message||'Password updated.',true);form.style.display='none';setTimeout(()=>location.href='/login',1800)}
    else{say(d.error||'Could not set password.',false);btn.disabled=false;btn.textContent='▶ SET PASSWORD'}
  }catch(_){say('Network error. Please try again.',false);btn.disabled=false;btn.textContent='▶ SET PASSWORD'}
});
</script>
</body>
</html>
