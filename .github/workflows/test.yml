name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Matches the runtime pinned in Dockerfile (FROM python:3.12-slim), so CI
      # exercises the same interpreter version the production image ships.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: .venv/bin/python3 -m pytest tests/ -q

      # Known-vulnerability scan against the pinned runtime deps. Intentionally NOT
      # wrapped in `|| true` / continue-on-error: a real finding here (e.g. the stale
      # werkzeug/cryptography pins tracked in the security audit) should fail the build
      # until the dependency bump lands, not be silently swallowed.
      - name: Audit dependencies for known vulnerabilities
        run: .venv/bin/pip-audit -r requirements.txt
